name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチで新しい push があったら、走っている検査は打ち切る。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # 書き出した out/ を実際のブラウザで開き、
  # 「コマンドを打つとグラフが動く」ところまでを通しで確かめる。
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # smoke で実際にブラウザを動かすので、ここでは Chromium の取得を止めない。
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # 出力の中のリンクを全部辿る。Markdown のリンクは素の <a> になり
      # basePath が付かないので、ソースを見ているだけでは気づけない。
      - name: Links
        run: npm run links

      - name: Smoke
        run: npm run smoke

      # 狭い画面でしか出ない壊れ方（横はみ出し・指で押せない大きさ・小さすぎる文字）。
      # 机の上の画面では、まず気づけない。
      - name: Mobile
        run: npm run mobile

      # 目で見ている限り気づけない壊れ方（キーボードトラップ・読み上げ）は、
      # ここでしか捕まらない。smoke と同じブラウザを使い回す。
      - name: Accessibility
        run: npm run a11y

      # 重いものをうっかり足していないか。accessibility / best-practices / seo は
      # 100 を必須、performance はページごとに下限を置いてある。
      - name: Lighthouse
        run: npm run lighthouse

      # 失敗したときだけ、目で見るためのスクリーンショットを残す。
      - name: Upload screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: artifacts/
          retention-days: 7
